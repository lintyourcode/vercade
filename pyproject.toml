[tool.poetry]
name = "vercade"
version = "0.1.0"
description = ""
authors = ["David <161997989+lintyourcode@users.noreply.github.com>"]
readme = "README.md"
license = "GPL-3.0-or-later"

[tool.poetry.dependencies]
python = "^3.11,<3.14"
python-dotenv = "^1.2.2"
discord = "^2.3.2"
pydantic-ai-slim = {extras = ["anthropic", "bedrock", "cohere", "google", "groq", "huggingface", "mcp", "mistral", "openai"], version = "^2.43.0"}
pydantic-ai-harness = {extras = ["skills"], version = "^0.31.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
ruff = "^0.16.0"
pytest-mock = "^3.15.1"
mypy = "^1.18.1"
fastmcp = "^4.0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests against a live Discord server (skipped without credentials)",
]
